spring.application.name=api-gateway
server.port=8080

# User Service Route
spring.cloud.gateway.server.webmvc.routes[0].id=user-service-route
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/users/**

# Product Service Route
spring.cloud.gateway.server.webmvc.routes[1].id=product-service-route
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://product-service
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/products/**

# Cart Service Route
spring.cloud.gateway.server.webmvc.routes[2].id=cart-service-route
spring.cloud.gateway.server.webmvc.routes[2].uri=lb://cart-service
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/cart/**

# Order Service Route
spring.cloud.gateway.server.webmvc.routes[3].id=order-service-route
spring.cloud.gateway.server.webmvc.routes[3].uri=lb://order-service
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/orders/**

# Authentication Route
spring.cloud.gateway.server.webmvc.routes[4].id=auth-service-route
spring.cloud.gateway.server.webmvc.routes[4].uri=lb://user-service
spring.cloud.gateway.server.webmvc.routes[4].predicates[0]=Path=/api/auth/**

# JWT Verification
jwt.secret=${JWT_SECRET}

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.cloud.client.ip-address}:${spring.application.name}:${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always